name: Installeur Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publier:
        description: "Publier l'installeur sur la page Releases du dépôt"
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      # Chaque build a une version croissante (1.0.<n° d'exécution>) : c'est ce qui permet aux postes de détecter la mise à jour.
      - run: npm pkg set version=1.0.${{ github.run_number }}
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with: { name: installeur-windows, path: release/*.exe }
      - name: Publier une release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publier }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v${VERSION}" release/*.exe \
            --target "${{ github.sha }}" \
            --title "Suivi Équipe ${VERSION}" \
            --notes "Installeur Windows. Première installation : lancer le .exe. Mise à jour d'un parc déjà installé : déposer ce fichier dans Paramètres → Publier une mise à jour (voir docs/DEPLOIEMENT.md)."
